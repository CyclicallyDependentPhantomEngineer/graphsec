name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ml]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --cov=graphsec --cov-report=term-missing

  no-sklearn:
    # The structural detector must still work on a minimal install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Assert scikit-learn is absent
        run: |
          if python -c "import sklearn" 2>/dev/null; then
            echo "scikit-learn must not be installed for this job"
            exit 1
          fi
      - run: pytest -q

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[ml]'
      - name: Scan this repository
        run: graphsec scan . --deep -f text
